<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>탑바 · LOLpick</title>
<style id="topbar-style">
:root{color-scheme:dark;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:#080c12;color:#edf2f8;line-height:1.6;font-synthesis:none;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}body{margin:0}.app-topbar{position:sticky;top:0;z-index:30;background:#0b111aee;border-bottom:1px solid #273344;backdrop-filter:blur(14px)}.topbar-inner{max-width:1160px;margin:auto;padding:0 38px;min-height:74px;display:flex;align-items:center;gap:35px}.topbar-brand{color:#d4b77c;font-size:17px;font-weight:800;letter-spacing:-.5px;text-decoration:none;white-space:nowrap}.topbar-brand span{color:#eef1f6}.topbar-nav{display:flex;align-items:stretch;align-self:stretch;gap:27px}.topbar-nav a{display:flex;align-items:center;position:relative;text-decoration:none;color:#8c9eb6;font-size:12px;white-space:nowrap}.topbar-nav a:hover{color:#e7edf7}.topbar-nav a[aria-current="page"]{color:#dcc28b}.topbar-nav a[aria-current="page"]::after{content:'';position:absolute;left:0;right:0;bottom:0;height:2px;background:#c8aa6e}.topbar-account{position:relative;margin-left:auto}.account-toggle{border:0;background:none;color:#edf2f8;display:flex;align-items:center;gap:11px;padding:8px 0;cursor:pointer;font:inherit;text-align:left}.account-avatar{width:30px;height:30px;border-radius:50%;border:1px solid #455064;background:#1b2534;display:grid;place-items:center;font-size:12px;color:#bdcadc}.account-copy{font-size:11px;font-weight:600;white-space:nowrap}.account-points{display:block;color:#9eadc1;font-size:10px;font-weight:400;font-variant-numeric:tabular-nums;line-height:1.5}.account-seal{display:inline-flex;align-items:center;justify-content:center;width:19px;height:22px;clip-path:polygon(7% 0,93% 0,93% 73%,50% 100%,7% 73%);border-top:2px solid #c8aa6e;background:#ff425818;color:#f18090;font-family:Impact,'Arial Black',sans-serif;font-size:8px;padding-bottom:3px}.account-chevron{color:#72859f;font-size:10px}.account-menu{position:absolute;right:0;top:calc(100% + 10px);width:165px;padding:7px;background:#121c29;border:1px solid #354357;border-radius:7px;box-shadow:0 12px 40px #0006}.account-menu a{display:block;padding:9px 10px;text-decoration:none;color:#bbc8da;font-size:11px;border-radius:3px}.account-menu a:hover{background:#202c3d;color:#eed4a1}.login-link{display:inline-block;border:1px solid #c8aa6e70;color:#dcca9f;padding:7px 16px;font-size:11px;text-decoration:none;border-radius:4px}.login-link:hover{border-color:#c8aa6e;background:#c8aa6e0b}.app-topbar [hidden]{display:none!important}.app-topbar a:focus-visible,.app-topbar button:focus-visible{outline:2px solid #c8aa6e;outline-offset:5px}
@media(max-width:800px){.topbar-inner{padding:0 20px;gap:24px}.topbar-nav{gap:20px}.account-avatar{display:none}}
@media(max-width:650px){.topbar-inner{padding:14px 16px 0;display:grid;grid-template-columns:1fr auto;gap:10px 15px;min-height:0}.topbar-brand{font-size:16px}.topbar-account{grid-column:2;grid-row:1}.topbar-nav{grid-column:1/-1;grid-row:2;display:grid;grid-template-columns:repeat(3,1fr);gap:0;height:40px}.topbar-nav a{justify-content:center;font-size:11px}.topbar-nav a[aria-current="page"]::after{left:15px;right:15px}.account-toggle{padding:0;gap:7px}.account-copy{font-size:10px}.account-points{font-size:9px}.account-seal{width:17px;height:19px}.login-link{padding:5px 14px;font-size:10px}.account-menu{top:calc(100% + 8px)}}
</style></head><body>
<header class="app-topbar" id="app-topbar"><div class="topbar-inner"><a class="topbar-brand" href="9.app.html?page=home" aria-label="LOLpick 대문">LOL<span>pick</span></a><nav class="topbar-nav" aria-label="주요 메뉴"><a data-page="schedule" href="9.app.html?page=schedule">경기일정</a><a data-page="ranking" href="9.app.html?page=ranking">랭킹</a><a data-page="profile" href="9.app.html?page=profile">마이페이지</a></nav><div class="topbar-account"><a class="login-link" id="login-link" href="9.app.html?auth=user" hidden>로그인</a><div id="account-user"><button class="account-toggle" id="account-toggle" type="button" aria-expanded="false" aria-controls="account-menu"><span class="account-avatar" aria-hidden="true">예</span><span class="account-copy">오늘의예측가<span class="account-points">128,500 P</span></span><span class="account-seal" role="img" aria-label="2026 Worlds T1 응원 인장">T1</span><span class="account-chevron" aria-hidden="true">▾</span></button><div class="account-menu" id="account-menu" hidden><a href="9.app.html?page=profile">내 프로필</a><a href="9.app.html?auth=guest">로그아웃</a></div></div></div></div></header>
<script>
const params=new URLSearchParams(location.search);const guest=params.get('auth')==='guest';document.querySelector('#login-link').hidden=!guest;document.querySelector('#account-user').hidden=guest;
const toggle=document.querySelector('#account-toggle'),menu=document.querySelector('#account-menu');toggle.addEventListener('click',()=>{menu.hidden=!menu.hidden;toggle.setAttribute('aria-expanded',String(!menu.hidden))});document.addEventListener('click',event=>{if(!event.target.closest('.topbar-account')){menu.hidden=true;toggle.setAttribute('aria-expanded','false')}});document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!menu.hidden){menu.hidden=true;toggle.setAttribute('aria-expanded','false');toggle.focus()}});
</script>
</body></html>
