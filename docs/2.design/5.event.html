<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark">
<title>2026 Worlds · LOLpick</title>
<style>
:root{color-scheme:dark;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:#080c12;color:#eef2f7;line-height:1.6;font-synthesis:none;-webkit-font-smoothing:antialiased;--gold:#c8aa6e}
*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}h1,h2,p{margin:0}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:5px}
.event-page{max-width:1080px;margin:auto;padding:44px 38px 70px}.event-brand{text-align:center;margin-bottom:46px}.event-mark{width:67px;height:79px;display:block;margin:0 auto 13px;color:#d6c39a}.event-brand h1{font-size:30px;letter-spacing:.17em;font-weight:650;line-height:1.3}.event-year{display:block;font-size:11px;letter-spacing:.35em;color:#8e9bad;margin-bottom:9px}.event-period{color:#8190a6;font-size:11px;margin-top:14px}
.timeline{padding:26px 30px 22px;background:#0d141e;border:1px solid #26313f}.timeline-dates{display:flex;justify-content:space-between;color:#9daabe;font-size:10px}.timeline-dates b{font-weight:500;color:#c7d0dc;margin-left:5px}.axis{position:relative;margin-top:13px;padding-top:55px}.stage-mark{white-space:nowrap;position:absolute;top:0;left:var(--position);transform:translateX(-50%);border:0;background:none;text-align:center;color:#8493a8;font-size:10px;line-height:1.5;padding:0 3px}.stage-mark:first-child{transform:none;text-align:left}.stage-mark:last-child{transform:translateX(-100%);text-align:right}.stage-mark span{display:block;color:#5f7189;font-size:9px}.stage-mark::after{content:'';display:block;width:1px;height:10px;background:#49576a;margin:7px auto 0}.stage-mark:first-child::after{margin-left:0}.stage-mark:last-child::after{margin-right:0}.stage-mark.active{color:#dcc38b}.stage-mark.active span{color:#b29c73}
.day-range{appearance:none;display:block;width:100%;height:18px;margin:0;border:0;background:var(--time-colors) center/100% 4px no-repeat,repeating-linear-gradient(90deg,#59667988 0 1px,transparent 1px calc(100% / 31)) center/100% 8px no-repeat;cursor:ew-resize}.today-pin{position:absolute;bottom:2px;left:var(--today-position);width:2px;height:15px;background:#b8c4d5;pointer-events:none;transform:translateX(-50%)}.today-pin::after{content:"오늘";position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:5px;font-size:8px;color:#b8c4d5;white-space:nowrap}.today-pin[hidden]{display:none}.day-range::-webkit-slider-thumb{appearance:none;width:13px;height:24px;border-radius:2px;background:#dec18a;border:2px solid #0d141e;box-shadow:0 0 14px #c8aa6e44}.day-range::-moz-range-thumb{width:9px;height:20px;border-radius:2px;background:#dec18a;border:2px solid #0d141e}.day-range::-moz-range-track{background:transparent}.date-controls{display:flex;justify-content:center;align-items:center;gap:20px;margin-top:23px}.day-step{width:32px;height:32px;border:1px solid #2c394a;border-radius:4px;background:#141e2b;color:#abb8cb;font-size:20px;line-height:1}.day-step:hover{border-color:#c8aa6e77;color:#dec18a}.day-step:disabled{opacity:.3;cursor:default}.selected-day{font-size:16px;font-weight:600;letter-spacing:-.3px;font-variant-numeric:tabular-nums;min-width:170px;text-align:center}.selected-sub{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:8px;font-size:10px;color:#8595ad}
.matches{margin-top:34px}.list-heading{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}.list-heading h2{font-size:12px;font-weight:550;color:#a6b4c8}.match-count{color:#667890;font-size:10px}.match-stack{display:grid;gap:13px}.event-match{display:grid;grid-template-columns:1fr 1fr;min-height:168px;border:1px solid #26313e;background:#0c131d;color:inherit;text-decoration:none;transition:border-color .18s,background .18s;overflow:hidden}.event-match:hover{border-color:#b89f6b;background:#101924}.match-summary{padding:26px 34px;display:flex;flex-direction:column;justify-content:center;background:radial-gradient(ellipse at 0 50%,var(--left-halo),transparent 70%),radial-gradient(ellipse at 100% 50%,var(--right-halo),transparent 70%)}.teams{display:grid;grid-template-columns:1fr 50px 1fr;align-items:center;text-align:center;margin-bottom:22px}.mini-logo{font-family:Impact,'Arial Black',sans-serif;font-size:38px;line-height:1;font-weight:900;letter-spacing:-1.5px;color:var(--team-color);transform:skew(-6deg)}.mini-logo.t1{font-size:46px}.vs{font-size:12px;color:#79889d;letter-spacing:.1em}.mini-gauge{height:8px;display:flex;box-shadow:0 0 10px #ffffff09}.mini-gauge span:first-child{width:var(--share);background:linear-gradient(90deg,var(--left-color),color-mix(in srgb,var(--left-color) 50%,#fff))}.mini-gauge span:last-child{flex:1;background:linear-gradient(90deg,color-mix(in srgb,var(--right-color) 50%,#fff),var(--right-color))}.match-info{padding:25px 30px;display:flex;flex-direction:column;justify-content:center;gap:11px}.info-top{display:flex;align-items:center;justify-content:space-between;gap:12px}.round{font-size:11px;color:#8a9ab0}.match-state{font-size:10px;border:1px solid #c8aa6e55;color:#e0c589;border-radius:4px;padding:4px 10px;white-space:nowrap;background:#c8aa6e09}.match-state.live{color:#99d5bf;border-color:#69a58d55;background:#69a58d0b}.match-state.closed{color:#a3aec0;border-color:#66768c55;background:#66768c09}.match-state.finished{color:#8e9fb8;border-color:#344253;background:none}.start{font-size:23px;font-weight:600;letter-spacing:-.5px;font-variant-numeric:tabular-nums}.start small{font-size:10px;font-weight:400;color:#798ba5;margin-right:9px;letter-spacing:0}.info-bottom{display:flex;justify-content:space-between;align-items:center;color:#8193ac;font-size:10px}.detail-arrow{color:#bac5d5;font-size:17px}.score{font-size:12px;color:#becada;letter-spacing:.08em}.empty{padding:58px 20px;border:1px solid #26313e;text-align:center;background:#0c131d;color:#8b9bb2;font-size:12px}.empty strong{display:block;color:#c5d0df;font-size:15px;font-weight:550;margin-bottom:8px}
@media(max-width:700px){.event-page{padding:30px 16px 45px}.event-brand{margin-bottom:30px}.event-brand h1{font-size:25px}.event-mark{width:54px;height:64px}.timeline{padding:20px 16px}.stage-mark{font-size:8px}.stage-mark span{font-size:8px}.axis{padding-top:75px}.stage-mark:first-child{top:26px}.stage-mark[data-day="3"]{font-size:0}.stage-mark[data-day="3"]::before{content:"스위스";display:block;font-size:8px}.date-controls{gap:11px}.selected-day{font-size:14px;min-width:145px}.selected-sub{font-size:9px}.event-match{min-height:145px}.match-summary{padding:22px 16px}.teams{grid-template-columns:1fr 27px 1fr;margin-bottom:20px}.mini-logo{font-size:27px;letter-spacing:-1px}.mini-logo.t1{font-size:33px}.vs{font-size:9px}.match-info{padding:18px 15px;gap:11px}.info-top{align-items:flex-start;flex-direction:column;gap:6px}.round{font-size:9px}.match-state{font-size:9px;padding:3px 7px}.start{font-size:18px}.start small{display:block;font-size:8px;margin:0 0 1px}.info-bottom{font-size:8px}.score{font-size:10px}.mini-gauge{height:6px}.timeline-dates{font-size:9px}.timeline-dates b{margin-left:3px}.list-heading h2{font-size:11px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="event-page">
<header class="event-brand">
<svg class="event-mark" viewBox="0 0 80 94" fill="none" aria-label="Worlds 이벤트 마크" role="img"><path d="M23 8h34l-3 35-14 15-14-15-3-35Z" stroke="currentColor" stroke-width="2"/><path d="M23 15H10v12c0 13 8 20 19 20M57 15h13v12c0 13-8 20-19 20M40 58v17M25 85l5-10h20l5 10H25Z" stroke="currentColor" stroke-width="2"/><path d="m40 17 7 13-7 13-7-13 7-13Z" fill="currentColor"/><path d="M18 89h44" stroke="currentColor" stroke-width="2"/></svg>
<h1><span class="event-year">2026</span>WORLDS</h1><p class="event-period">10월 1일 — 11월 1일</p>
</header>
<section class="timeline" aria-label="이벤트 날짜 선택">
<div class="timeline-dates"><span>시작<b>10.01</b></span><span>종료<b>11.01</b></span></div>
<div class="axis" id="axis"><input class="day-range" id="day-range" type="range" min="0" max="31" step="1" value="0" aria-label="경기 날짜" aria-describedby="selected-sub"><span class="today-pin" id="today-pin" role="img" aria-label="오늘 날짜의 위치"></span></div>
<div class="date-controls"><button class="day-step" id="previous-day" type="button" aria-label="이전 날짜">‹</button><p class="selected-day" id="selected-day"></p><button class="day-step" id="next-day" type="button" aria-label="다음 날짜">›</button></div>
<div class="selected-sub" id="selected-sub"><span id="selected-stage"></span><span id="selected-offset"></span></div>
</section>
<section class="matches" aria-labelledby="matches-title"><div class="list-heading"><h2 id="matches-title">경기 일정</h2><span class="match-count" id="match-count"></span></div><div class="match-stack" id="match-stack" aria-live="polite"></div></section>
</main>
<script>
const DAY = 86400000;
const start = Date.UTC(2026,9,1), end = Date.UTC(2026,10,1);
const lastDay = (end-start)/DAY;
const stages = [{day:0,name:'플레이인',format:'BO3'},{day:3,name:'스위스 스테이지',format:'BO3'},{day:21,name:'8강',format:'BO5'},{day:27,name:'4강',format:'BO5'},{day:31,name:'결승',format:'BO5'}];
const teams = {GEN:{name:'Gen.G',color:'#d5b367'},T1:{name:'T1',color:'#ff4258'},HLE:{name:'Hanwha Life',color:'#ee8a45'},BLG:{name:'Bilibili Gaming',color:'#40b8ae'},G2:{name:'G2 Esports',color:'#b2bbc9'},TES:{name:'Top Esports',color:'#e2685e'}};
const dateKey = day => new Date(start+day*DAY).toISOString().slice(0,10);
const monthDay = day => {const d=new Date(start+day*DAY);return `${String(d.getUTCMonth()+1).padStart(2,'0')}.${String(d.getUTCDate()).padStart(2,'0')}`};
const parts = Object.fromEntries(new Intl.DateTimeFormat('en',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).map(p=>[p.type,p.value]));
const todayDay = Math.round((Date.UTC(Number(parts.year),Number(parts.month)-1,Number(parts.day))-start)/DAY);
const clamp = day => Math.max(0,Math.min(lastDay,day));
const range=document.querySelector('#day-range');
const todayPin=document.querySelector('#today-pin');
todayPin.hidden=todayDay<0||todayDay>lastDay;
const todayFraction=clamp(todayDay)/lastDay;
todayPin.style.setProperty('--today-position',`calc(${todayFraction*100}% + ${6.5-13*todayFraction}px)`);
const stageFor = day => [...stages].reverse().find(stage=>day>=stage.day);
function matchesFor(day){
 const stage=stageFor(day);
 if([2,19,20,25,26,29,30].includes(day))return [];
 const pairs=stage.day===31?[['GEN','T1']]:stage.day>=21?[day%2?['GEN','T1']:['HLE','BLG']]:[['GEN','T1'],['HLE','BLG'],['G2','TES']];
 return pairs.map(([left,right],index)=>{
 const hour=18+index*2;const at=new Date(`${dateKey(day)}T${String(hour).padStart(2,'0')}:00:00+09:00`).getTime();
 const now=Date.now();const status=now>=at+3*3600000?'finished':now>=at?'live':now>=at-10*60000?'closed':'open';
 const leftPool=5408000-index*1300000,rightPool=4992000-index*900000;
 return {left,right,at,status,leftPool,rightPool,stage:stage.name,format:stage.format,index};
 });
}
for(const stage of stages){const button=document.createElement('button');button.type='button';button.className='stage-mark';button.dataset.day=stage.day;button.style.setProperty('--position',`${stage.day/lastDay*100}%`);button.innerHTML=`${stage.name}<span>${monthDay(stage.day)}</span>`;button.addEventListener('click',()=>{selectDay(stage.day);range.focus()});document.querySelector('#axis').insertBefore(button,range)}
function selectDay(value){
 const day=clamp(Number(value));range.value=day;
 const current=clamp(todayDay)/lastDay*100, selected=day/lastDay*100;
 const colors=day>clamp(todayDay)
   ? `linear-gradient(90deg,#9b8353 0 ${current}%,#7fabc5 ${current}% ${selected}%,#293545 ${selected}% 100%)`
   : `linear-gradient(90deg,#9b8353 0 ${selected}%,#d5b367 ${selected}% ${current}%,#293545 ${current}% 100%)`;
 range.style.setProperty('--time-colors',colors);
 range.dataset.direction=day===clamp(todayDay)?'today':day<clamp(todayDay)?'past':'future';
 const offset=day-todayDay;
 document.querySelector('#selected-offset').textContent=offset===0?'':`${Math.abs(offset)}일 ${offset<0?'이전':'이후'}`;
 const selectedDate=new Date(start+day*DAY);const weekday=['일','월','화','수','목','금','토'][selectedDate.getUTCDay()];
 const label=`${selectedDate.getUTCMonth()+1}월 ${selectedDate.getUTCDate()}일 (${weekday})`;
 document.querySelector('#selected-day').textContent=label;range.setAttribute('aria-valuetext',`2026년 ${label}`);
 const stage=stageFor(day);document.querySelector('#selected-stage').textContent=stage.name;
 document.querySelectorAll('.stage-mark').forEach(mark=>{const active=Number(mark.dataset.day)===stage.day;mark.classList.toggle('active',active);mark.setAttribute('aria-current',active?'step':'false')});
 document.querySelector('#previous-day').disabled=day===0;document.querySelector('#next-day').disabled=day===lastDay;
 const matches=matchesFor(day);document.querySelector('#matches-title').textContent=`${label} 경기`;document.querySelector('#match-count').textContent=`${matches.length}경기`;
 const stack=document.querySelector('#match-stack');stack.replaceChildren();
 for(const match of matches){
 const state={open:'베팅 가능',closed:'베팅 종료',live:'경기 진행 중',finished:'경기 종료'}[match.status];
 const params=new URLSearchParams({left:match.left,right:match.right,date:new Date(match.at).toISOString(),stage:match.stage,format:match.format,status:match.status,leftPool:match.leftPool,rightPool:match.rightPool});
 const card=document.createElement('a');card.className='event-match';card.href=`6.event-match.html?${params}`;card.setAttribute('aria-label',`${teams[match.left].name} 대 ${teams[match.right].name}, ${label} ${18+match.index*2}시, ${state}, 경기 상세 보기`);
 card.style.setProperty('--left-color',teams[match.left].color);card.style.setProperty('--right-color',teams[match.right].color);card.style.setProperty('--left-halo',teams[match.left].color+'0c');card.style.setProperty('--right-halo',teams[match.right].color+'0c');card.style.setProperty('--share',`${match.leftPool/(match.leftPool+match.rightPool)*100}%`);
 card.innerHTML=`<div class="match-summary"><div class="teams"><span class="mini-logo ${match.left.toLowerCase()}" style="--team-color:${teams[match.left].color}" aria-label="${teams[match.left].name}">${match.left}</span><span class="vs">VS</span><span class="mini-logo ${match.right.toLowerCase()}" style="--team-color:${teams[match.right].color}" aria-label="${teams[match.right].name}">${match.right}</span></div><div class="mini-gauge" role="img" aria-label="베팅 포인트 비중 ${match.left} ${Math.round(match.leftPool/(match.leftPool+match.rightPool)*100)}%, ${match.right} ${Math.round(match.rightPool/(match.leftPool+match.rightPool)*100)}%"><span></span><span></span></div></div><div class="match-info"><div class="info-top"><p class="round">${match.stage} · ${match.format}</p><span class="match-state ${match.status}">${state}</span></div><p class="start"><small>시작 예정</small>${18+match.index*2}:00</p><div class="info-bottom"><span>${match.status==='finished'?'<b class="score">2 : 1</b>':match.status==='live'?'<b class="score">1 : 0</b>':'한국 시간'}</span><span class="detail-arrow" aria-hidden="true">↗</span></div></div>`;
 stack.append(card);
 }
 if(!matches.length){const empty=document.createElement('div');empty.className='empty';empty.innerHTML='<strong>예정된 경기가 없습니다</strong>다른 날짜의 경기 일정을 확인해 보세요.';stack.append(empty)}
}
range.addEventListener('input',()=>selectDay(range.value));
document.querySelector('#previous-day').addEventListener('click',()=>selectDay(Number(range.value)-1));document.querySelector('#next-day').addEventListener('click',()=>selectDay(Number(range.value)+1));
selectDay(clamp(todayDay));
</script>
</body>
</html>
