<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>LOLpick</title><style>body{margin:0;background:#080c12;color:#edf2f8}#topbar-host{display:contents}#screen{width:100%;border:0;display:block;height:1000px}.load-error{padding:40px;font:14px system-ui;color:#9caec5}</style></head><body><div id="topbar-host"></div><iframe id="screen" title="LOLpick 화면"></iframe>
<script>
(async()=>{
const params=new URLSearchParams(location.search);const current=params.get('page')||'home';const guest=params.get('auth')==='guest';
const source=await fetch('8.topbar.html');if(!source.ok)throw new Error('탑바를 불러오지 못했습니다.');const template=new DOMParser().parseFromString(await source.text(),'text/html');document.head.append(template.querySelector('#topbar-style'));document.querySelector('#topbar-host').append(template.querySelector('#app-topbar'));
const auth=guest?'guest':'user';document.querySelector('#login-link').hidden=!guest;document.querySelector('#account-user').hidden=guest;
document.querySelectorAll('.topbar-brand,.topbar-nav a,.account-menu a').forEach(link=>{const url=new URL(link.href);if(!url.searchParams.has('auth'))url.searchParams.set('auth',auth);link.href=url.href});document.querySelector('#login-link').href=`9.app.html?page=${current}&auth=user`;
function activate(page){document.querySelectorAll('.topbar-nav a').forEach(link=>{if(link.dataset.page===page)link.setAttribute('aria-current','page');else link.removeAttribute('aria-current')})}activate(current);
const toggle=document.querySelector('#account-toggle'),menu=document.querySelector('#account-menu');function closeMenu(){menu.hidden=true;toggle.setAttribute('aria-expanded','false')}toggle.addEventListener('click',()=>{menu.hidden=!menu.hidden;toggle.setAttribute('aria-expanded',String(!menu.hidden))});document.addEventListener('click',e=>{if(!e.target.closest('.topbar-account'))closeMenu()});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!menu.hidden){closeMenu();toggle.focus()}});
const frame=document.querySelector('#screen');let observer;frame.addEventListener('load',()=>{
 const doc=frame.contentDocument;if(!doc?.body)return;observer?.disconnect();doc.querySelector('.page-heading .brand')?.remove();
 const resize=()=>{frame.style.height=Math.max(300,Math.ceil(doc.body.getBoundingClientRect().height)+parseFloat(getComputedStyle(doc.body).marginTop||0)+parseFloat(getComputedStyle(doc.body).marginBottom||0))+'px'};
 observer=new ResizeObserver(resize);observer.observe(doc.body);resize();doc.addEventListener('pointerdown',closeMenu);doc.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
 if(!frame.srcdoc){const url=frame.contentWindow.location.pathname;activate(url.endsWith('/10.profile.html')?'profile':url.endsWith('/7.events.html')&&current==='home'?'home':'schedule')}
});
if(current==='home'||current==='schedule'){frame.src='7.events.html';}
else if(current==='profile'&&!guest){frame.src='10.profile.html';}
else{
const style=`<style>:root{color-scheme:dark;font-family:'Apple SD Gothic Neo','Malgun Gothic',system-ui;background:#080c12;color:#edf2f8;line-height:1.6}*{box-sizing:border-box}body{margin:0}.page{max-width:1160px;margin:auto;padding:42px 38px}h1{font-size:20px;font-weight:600;margin:0 0 26px}h2{font-size:14px;font-weight:550}p{margin:0}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:15px 13px;border-bottom:1px solid #263448}th{font-size:10px;color:#8193ae;font-weight:400}.gain{color:#d5bf90}.account-card{border:1px solid #2b394d;background:#101925;padding:25px;margin-bottom:20px}.nick{font-size:22px;font-weight:650}.muted{color:#899bb5;font-size:11px;margin-top:7px}.seal{color:#ea8697}.points{font-size:29px;color:#dfc58e;font-variant-numeric:tabular-nums;margin-top:8px}.table-wrap{overflow-x:auto}@media(max-width:650px){.page{padding:27px 16px}td,th{padding:12px 9px}table{font-size:11px}}</style>`;
const content=current==='ranking'?`<h1>랭킹</h1><p class="muted" style="margin-bottom:20px">2026 Worlds · 베팅 손익</p><div class="table-wrap"><table><thead><tr><th>순위</th><th>닉네임</th><th>베팅 손익</th></tr></thead><tbody>${[['역배의신','892,400'],['페이커의오른팔','764,200'],['젠지우승가자','701,500'],['바론앞5대5','645,000'],['티원화이팅','590,300']].map((r,i)=>`<tr><td>${i+1}</td><td>${r[0]}</td><td class="gain">+${r[1]} P</td></tr>`).join('')}</tbody></table></div>`:guest?`<h1>마이페이지</h1><p class="muted">로그인하면 내 응원 팀과 베팅 기록을 확인할 수 있습니다.</p><a href="9.app.html?page=profile&auth=user" target="_parent" style="display:inline-block;margin-top:20px;color:#d6bd89">로그인</a>`:`<h1>마이페이지</h1><section class="account-card"><p class="nick">오늘의예측가</p><p class="muted">2026 Worlds · <span class="seal">T1 응원 인장</span></p></section><section class="account-card"><h2>보유 포인트</h2><p class="points">128,500 P</p></section><section class="account-card"><h2>내 베팅</h2><p class="muted">아직 베팅한 경기가 없습니다.</p></section>`;
frame.srcdoc=`<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">${style}</head><body><main class="page">${content}</main></body></html>`;
}
})().catch(error=>{const p=document.createElement('p');p.className='load-error';p.textContent=error.message;document.body.append(p)});
</script>
</body></html>
