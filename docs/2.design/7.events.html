<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>이벤트 · LOLpick</title>
<style>
:root{color-scheme:dark;--bg:#080c12;--gold:#c8aa6e;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;background:var(--bg);color:#edf2f8;line-height:1.6;font-synthesis:none;-webkit-font-smoothing:antialiased}*{box-sizing:border-box}body{margin:0}h1,h2,h3,p{margin:0}a{color:inherit;text-decoration:none}a:focus-visible{outline:2px solid var(--gold);outline-offset:4px}.symbols{position:absolute;width:0;height:0;overflow:hidden}.events-page{max-width:1160px;margin:auto;padding:42px 38px 52px}.page-heading{display:flex;align-items:center;gap:18px;margin-bottom:43px}.brand{color:var(--gold);font-size:11px;letter-spacing:.15em}.page-heading h1{font-size:18px;font-weight:550}.legend{margin-left:auto;display:flex;gap:19px;font-size:10px;color:#8293aa}.legend span{display:flex;align-items:center;gap:7px}.legend i{width:13px;height:2px;background:#ad9769}.legend span:last-child i{background:#738ea7}.chronology-scroll{overflow-x:auto;scrollbar-width:thin;scrollbar-color:#4b5565 #111923}.chronology{min-width:880px}.year-row{height:330px;display:grid;grid-template-columns:minmax(0,1fr) 86px}.year-lanes{position:relative;min-width:0}.year-label{position:sticky;right:0;z-index:6;background:#080c12;isolation:isolate}.year-label::before{content:'';position:absolute;left:0;top:0;bottom:0;width:1px;background:#394655}.year-label::after{content:'';position:absolute;left:-4px;top:145px;width:9px;height:9px;background:#586a81;border:2px solid #080c12}.year-label h2{position:absolute;top:130px;left:19px;font-size:22px;font-weight:550;letter-spacing:-.6px;color:#8fa0b7}.year-label small{display:block;font-size:9px;font-weight:400;letter-spacing:0;color:#7b8aa0;margin-top:2px}.current-year .year-label h2{color:#e0c58b}.current-year .year-label::after{background:#dec28b}.year-row:first-child .year-label::before{top:45px}.year-row:last-child .year-label::before{bottom:170px}.month-axis{position:absolute;top:149px;left:0;right:0;height:1px;background:#354454}.month-mark{position:absolute;left:var(--month-position);top:-24px;font-size:9px;color:#60738e;transform:translateX(-50%);font-variant-numeric:tabular-nums}.month-mark:first-child{transform:none}.month-mark::after{content:'';display:block;width:1px;height:7px;background:#3e5065;margin:5px auto 0}.month-mark:first-child::after{margin-left:0}.league-card{position:absolute;top:53px;left:var(--event-start);width:var(--event-width);height:63px;display:flex;align-items:center;gap:15px;padding:12px 20px;border:1px solid #c8aa6e40;background:linear-gradient(90deg,#c8aa6e13,#c8aa6e06);border-top:2px solid #ab9160;border-radius:3px}.league-mark{font-family:Impact,'Arial Black',sans-serif;font-size:26px;font-style:italic;letter-spacing:-1px;color:#c6b083}.league-title{font-size:13px;font-weight:600;color:#c8d1de}.event-period{font-size:9px;color:#8091a9;font-variant-numeric:tabular-nums;margin-top:3px}.event-state{margin-left:auto;white-space:nowrap;color:#a2b493;border:1px solid #829c6040;background:#829c6008;padding:3px 7px;border-radius:3px;font-size:9px}.past-year .league-card{border-color:#48566a55;border-top-color:#59677a;background:#101721}.past-year .league-mark{color:#748399}.past-year .league-title{color:#9eacc0}.past-year .event-state{color:#728299;border-color:#354357;background:none}.international-card{position:absolute;top:186px;left:clamp(0px,calc(var(--event-center) - 76px),calc(100% - 158px));width:152px;min-height:96px;padding:14px 15px;background:#0d151f;border:1px solid #2c3a4c;border-top:2px solid #596e87;border-radius:3px;transition:border-color .18s,background .18s}.international-card::before{content:'';position:absolute;left:50%;top:-15px;height:13px;width:1px;background:#41556e}.international-top{display:flex;align-items:center;gap:9px}.event-icon{width:23px;height:28px;color:#8fabc4}.international-name{font-size:12px;font-weight:650;letter-spacing:.06em;color:#bdcada}.international-card .event-period{margin-top:11px}.international-card .event-state{display:inline-block;margin-top:8px;margin-left:0;font-size:8px;padding:0;border:0;background:none;color:#7f91ab}.international-card.current-event{border-color:#c8aa6e66;border-top-color:#c8aa6e;background:#c8aa6e09}.current-event .event-icon,.current-event .international-name{color:#dec694}.current-event .event-state{color:#c7b17d}.international-card[href]:hover{border-color:#e3c182;background:#c8aa6e13}.open-arrow{float:right;color:#d7bf86;font-size:13px}.event-span{position:absolute;top:163px;left:var(--event-start);width:var(--event-width);height:3px;background:#6b839d70}.event-span.current-event{background:#c8aa6eaa}.current-time{position:absolute;left:var(--now-position);top:30px;bottom:28px;width:1px;background:linear-gradient(#c8aa6e18,#c8aa6e99 45%,#c8aa6e18);pointer-events:none;z-index:2}.current-time::after{content:'';position:absolute;top:115px;left:-3px;width:7px;height:7px;background:#dfc186;transform:rotate(45deg);box-shadow:0 0 12px #c8aa6e33}.current-time span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);padding-bottom:6px;font-size:9px;color:#d2bb86;white-space:nowrap}.current-year .month-axis{background:linear-gradient(90deg,#c8aa6e55 0 var(--now-position),#354454 var(--now-position) 100%)}
@media(max-width:700px){.events-page{padding:27px 16px 38px}.page-heading{margin-bottom:34px;gap:13px}.page-heading h1{font-size:16px}.legend{font-size:9px;gap:12px}.brand{font-size:10px}.year-row{grid-template-columns:minmax(0,1fr) 66px}.year-label h2{left:14px;font-size:19px;top:133px}.year-label{box-shadow:-12px 0 18px #080c12b3}.league-card{padding-inline:15px}.chronology-scroll{padding-bottom:10px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><symbol id="worlds-symbol" viewBox="0 0 80 94"><g fill="none" stroke="currentColor" stroke-width="3"><path d="M23 8h34l-3 35-14 15-14-15-3-35Z"/><path d="M23 15H10v12c0 13 8 20 19 20M57 15h13v12c0 13-8 20-19 20M40 58v17M25 85l5-10h20l5 10H25Z"/><path d="M18 89h44"/></g><path d="m40 17 7 13-7 13-7-13 7-13Z" fill="currentColor"/></symbol><symbol id="international-symbol" viewBox="0 0 60 70"><path d="m30 3 25 30-25 34L5 33 30 3Z" fill="none" stroke="currentColor" stroke-width="3"/><path d="m30 15 14 18-14 21-14-21 14-18Z" fill="currentColor" opacity=".3"/></symbol></defs></svg>
<main class="events-page"><header class="page-heading"><span class="brand">LOLPICK</span><h1>이벤트</h1><div class="legend" aria-label="카드 구분"><span><i aria-hidden="true"></i>리그</span><span><i aria-hidden="true"></i>국제대회</span></div></header><div class="chronology-scroll" id="chronology-scroll" tabindex="0" aria-label="연도별 이벤트 타임라인"><div class="chronology" id="chronology"></div></div></main>
<script>
const dateParts=Object.fromEntries(new Intl.DateTimeFormat('en',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).map(part=>[part.type,part.value]));
const todayYear=Number(dateParts.year);const today=Date.UTC(todayYear,Number(dateParts.month)-1,Number(dateParts.day));
const years=[2026,2025,2024];const page=document.querySelector('#chronology');
for(const year of years){
 const first=Date.UTC(year,0,1),last=Date.UTC(year,11,31);const position=(month,day)=>Math.max(0,Math.min(100,(Date.UTC(year,month-1,day)-first)/(last-first)*100));
 const section=document.createElement('section');section.className=`year-row ${year===todayYear?'current-year':'past-year'}`;section.setAttribute('aria-labelledby',`year-${year}`);
 const lanes=document.createElement('div');lanes.className='year-lanes';
 const league=document.createElement('article');league.className='league-card';league.style.setProperty('--event-start',`${position(1,14)}%`);league.style.setProperty('--event-width',`${position(11,22)-position(1,14)}%`);league.setAttribute('aria-label',`${year} LCK 시즌, 1월 14일부터 11월 22일까지`);
 league.innerHTML=`<span class="league-mark">LCK</span><div><h3 class="league-title">${year} LCK 시즌</h3><p class="event-period">01.14 — 11.22</p></div><span class="event-state">${year===todayYear?'진행 중':'종료'}</span>`;lanes.append(league);
 const axis=document.createElement('div');axis.className='month-axis';axis.setAttribute('aria-label',`${year}년 1월부터 12월까지`);for(let month=1;month<=12;month++){const mark=document.createElement('span');mark.className='month-mark';mark.style.setProperty('--month-position',`${position(month,1)}%`);mark.textContent=`${month}월`;axis.append(mark)}lanes.append(axis);
 const events=[{name:'FIRST STAND',start:[3,15],end:[3,22],icon:'international-symbol'},{name:'MSI',start:[7,1],end:[7,19],icon:'international-symbol'},{name:'WORLDS',start:[10,1],end:[11,1],icon:'worlds-symbol'}];
 for(const event of events){
 const from=position(...event.start),to=position(...event.end);const current=year===2026&&event.name==='WORLDS';const span=document.createElement('div');span.className=`event-span${current?' current-event':''}`;span.style.setProperty('--event-start',`${from}%`);span.style.setProperty('--event-width',`${to-from}%`);span.setAttribute('aria-hidden','true');lanes.append(span);
 const card=document.createElement(current?'a':'article');card.className=`international-card${current?' current-event':''}`;card.style.setProperty('--event-center',`${(from+to)/2}%`);if(current){card.href='5.event.html';card.setAttribute('aria-label',`${year} Worlds, 경기 일정 보기`)}
 const mmdd=parts=>parts.map(part=>String(part).padStart(2,'0')).join('.');
 card.innerHTML=`<div class="international-top"><svg class="event-icon" aria-hidden="true"><use href="#${event.icon}"/></svg><h3 class="international-name">${event.name}</h3></div><p class="event-period">${mmdd(event.start)} — ${mmdd(event.end)}</p><span class="event-state">${current?'스위스 스테이지':'종료'}</span>${current?'<span class="open-arrow" aria-hidden="true">↗</span>':''}`;lanes.append(card);
 }
 if(year===todayYear){const now=(today-first)/(last-first)*100;lanes.style.setProperty('--now-position',`${now}%`);const marker=document.createElement('div');marker.className='current-time';marker.style.setProperty('--now-position',`${now}%`);marker.setAttribute('aria-label',`오늘 ${dateParts.month}월 ${dateParts.day}일`);marker.innerHTML=`<span>오늘 · ${dateParts.month}.${dateParts.day}</span>`;lanes.append(marker)}
 const label=document.createElement('div');label.className='year-label';label.innerHTML=`<h2 id="year-${year}">${year}${year===todayYear?'<small>올해</small>':''}</h2>`;section.append(lanes,label);page.append(section);
}
const scroller=document.querySelector('#chronology-scroll');if(scroller.scrollWidth>scroller.clientWidth)scroller.scrollLeft=scroller.scrollWidth-scroller.clientWidth;
</script>
</body>
</html>
